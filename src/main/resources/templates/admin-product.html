<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>상품 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $.ajaxSetup({
            xhrFields: { withCredentials: true }
        });

        function getQueryParam(name, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name) || defaultValue;
        }

        $(document).ready(function () {

            let currentPage = parseInt(getQueryParam('page', 0));
            const size = parseInt(getQueryParam('size', 10));
            const sort = getQueryParam('sort', 'id,asc');

            $('#sortKey').val(sort.split(',')[0]);
            $('#sortDir').val(sort.split(',')[1]);

            $('#sortKey, #sortDir').on('change', function () {
                const newSortKey = $('#sortKey').val();
                const newSortDir = $('#sortDir').val();

                const newUrl = new URL(window.location.href);
                newUrl.searchParams.set('page', 0);
                newUrl.searchParams.set('size', size);
                newUrl.searchParams.set('sort', `${newSortKey},${newSortDir}`);

                window.location.href = newUrl.toString();
            });

            $('#addProduct').on('click', function () {
                const $btn = $(this)
                $btn.prop('disabled', true);
                const name = $('#nameInput').val();
                const price = $('#priceInput').val();
                const imageURL = $('#imageURLInput').val();

                $.ajax({
                    url: '/api/products',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ name, price, imageURL }),
                    success: function () {
                        $('#nameInput, #priceInput, #imageURLInput').val('');
                        // 추가 후 첫 페이지로 이동
                        const newUrl = new URL(window.location.href);
                        newUrl.searchParams.set('page', 0);
                        newUrl.searchParams.set('size', size);
                        newUrl.searchParams.set('sort', sort);
                        window.location.href = newUrl.toString();
                    },
                    error: function (jqXHR) {
                        let message = "상품 추가 실패"
                        if (jqXHR.responseJSON) {
                            const errors = [];
                            const fieldErrors = jqXHR.responseJSON.fieldErrors;
                            const objectErrors = jqXHR.responseJSON.objectErrors;

                            if (fieldErrors) {
                                for (const key in fieldErrors) errors.push(fieldErrors[key]);
                            }
                            if (objectErrors) {
                                for (const err of objectErrors) errors.push(err.message);
                            }
                            if (errors.length > 0) message = errors.join('\n');
                        }
                        alert(message);
                    },
                    complete: function () {
                        $btn.prop('disabled', false);
                    }
                });
            });

            function fetchProducts(page = 0) {
                $.ajax({
                    url: `/api/products?page=${page}&size=${size}&sort=${sort}`,
                    method: 'GET',
                    success: function (data) {
                        const products = data.content;
                        const totalPages = data.page.totalPages;
                        currentPage = data.page.number;

                        let html = `
                            <table class="table table-striped table-hover mt-4">
                                <thead class="table-dark">
                                    <tr>
                                        <th>이름</th>
                                        <th>가격</th>
                                        <th>이미지</th>
                                        <th>수정</th>
                                        <th>제거</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                        for (const product of products) {
                            html += `
                                <tr>
                                    <td>${product.name}</td>
                                    <td>${product.price.toLocaleString()}원</td>
                                    <td><img src="${product.imageURL}" alt="img" width="60" height="60" class="rounded shadow-sm"></td>
                                    <td><button class="btn btn-warning btn-sm editBtn" data-id="${product.id}">수정</button></td>
                                    <td><button class="btn btn-danger btn-sm deleteBtn" data-id="${product.id}">제거</button></td>
                                </tr>`;
                        }
                        html += `</tbody></table>`;
                        $('#result').html(html);
                        renderPagination(totalPages);
                    },
                    error: function () {
                        $('#result').html('<div class="alert alert-danger">상품 목록을 불러오는 데 실패했습니다.</div>');
                    }
                });
            }

            function renderPagination(totalPages) {
                let paginationHtml = `<nav><ul class="pagination justify-content-center mt-4">`;
                for (let i = 0; i < totalPages; i++) {
                    const active = i === currentPage ? 'active' : '';
                    paginationHtml += `
                        <li class="page-item ${active}">
                            <a class="page-link" href="?page=${i}&size=${size}&sort=${sort}">${i + 1}</a>
                        </li>`;
                }
                paginationHtml += `</ul></nav>`;
                $('#pagination').html(paginationHtml);
            }

            $('#result').on('click', '.deleteBtn', function () {
                const $btn = $(this);
                const productId = $btn.data('id');
                if (confirm('정말 삭제하시겠습니까?')) {
                    $btn.prop('disabled', true);
                    $.ajax({
                        url: `/api/products/${productId}`,
                        method: 'DELETE',
                        success: function () {
                            fetchProducts(currentPage);
                        },
                        error: function (jqXHR) {
                            let message = "상품 삭제 실패";
                            if (jqXHR.responseJSON) {
                                const errors = [];
                                const fieldErrors = jqXHR.responseJSON.fieldErrors;
                                const objectErrors = jqXHR.responseJSON.objectErrors;
                                if (fieldErrors) {
                                    for (const key in fieldErrors) errors.push(fieldErrors[key]);
                                }
                                if (objectErrors) {
                                    for (const err of objectErrors) errors.push(err.message);
                                }
                                if (errors.length > 0) message = errors.join('\n');
                            }
                            alert(message);
                        },
                        complete: function () {
                            $btn.prop('disabled', false);
                        }
                    });
                }
            });

            $('#result').on('click', '.editBtn', function () {
                const productId = $(this).data('id');
                window.location.href = `/admin/products/${productId}`;
            });

            fetchProducts(currentPage);
        });
    </script>
</head>

<body class="bg-light">
<!-- 공통 헤더 포함 -->
<div th:replace="~{fragments/header.html}"></div>
<div class="container mt-5">
    <h1 class="text-center text-primary fw-bold mb-4">상품 관리</h1>

    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" id="nameInput" class="form-control" placeholder="상품 이름">
        </div>
        <div class="col-md-3">
            <input type="number" id="priceInput" class="form-control" placeholder="상품 가격">
        </div>
        <div class="col-md-4">
            <input type="text" id="imageURLInput" class="form-control" placeholder="상품 이미지 URL">
        </div>
        <div class="col-md-1 d-grid">
            <button id="addProduct" class="btn btn-success">추가</button>
        </div>
    </div>

    <hr>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="sortKey" class="form-label">정렬 기준</label>
            <select id="sortKey" class="form-select">
                <option value="id">ID</option>
                <option value="name">이름</option>
                <option value="price">가격</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="sortDir" class="form-label">정렬 방향</label>
            <select id="sortDir" class="form-select">
                <option value="asc">오름차순</option>
                <option value="desc">내림차순</option>
            </select>
        </div>
    </div>

    <hr>

    <div id="result"></div>
    <div id="pagination"></div>
</div>
</body>
</html>
